options {
    listen-on port 53 { 192.168.50.11; };
    listen-on-v6 port 53 { ::1; };
    directory       "/var/named";
    dump-file       "/var/named/data/cache_dump.db";
    statistics-file "/var/named/data/named_stats.txt";
    memstatistics-file "/var/named/data/named_mem_stats.txt";
    recursion yes;
    allow-query     { any; };
    dnssec-validation yes;
    bindkeys-file "/etc/named.iscdlv.key";
    managed-keys-directory "/var/named/dynamic";
    pid-file "/run/named/named.pid";
    session-keyfile "/run/named/session.key";
};

logging {
    channel default_debug {
        file "data/named.run";
        severity dynamic;
    };
};

include "/etc/named.zonetransfer.keys";
server 192.168.50.10 {
    keys { "zonetransfer.key"; };
};

// 1. STORAGE — физически забирает зоны (не для клиентов)
view "storage" {
    match-clients { 0.0.0.0/32; };

    zone "." IN { type hint; file "named.ca"; };
    include "/etc/named.rfc1912.zones";
    include "/etc/named.root.key";

    zone "dns.lab" {
        type slave;
        masters { 192.168.50.10 key "zonetransfer.key"; };
        file "/var/named/slaves/named.dns.lab.default";
        allow-transfer { none; };
    };
    zone "newdns.lab" {
        type slave;
        masters { 192.168.50.10 key "zonetransfer.key"; };
        file "/var/named/slaves/named.newdns.lab.default";
        allow-transfer { none; };
    };
};

// 2. CLIENT1 — для client1
view "client1" {
    match-clients { 192.168.50.15; };

    zone "." IN { type hint; file "named.ca"; };
    include "/etc/named.rfc1912.zones";
    include "/etc/named.root.key";

    zone "dns.lab" {
        type slave;
        masters { 192.168.50.10 key "client1-transfer-key"; };
        file "/var/named/slaves/named.dns.lab.client1";
        allow-transfer { none; };
    };
    zone "newdns.lab" {
        in-view "storage";
    };
};

// 3. CLIENT2 — для client2 (БЕЗ newdns.lab)
view "client2" {
    match-clients { 192.168.50.16; };

    zone "." IN { type hint; file "named.ca"; };
    include "/etc/named.rfc1912.zones";
    include "/etc/named.root.key";

    zone "dns.lab" {
        in-view "storage";
    };
};

// 4. DEFAULT — последний, для всех остальных (БЕЗ newdns.lab)
view "default" {
    match-clients { any; };

    zone "." IN { type hint; file "named.ca"; };
    include "/etc/named.rfc1912.zones";
    include "/etc/named.root.key";

    zone "dns.lab" {
        in-view "storage";
    };
};

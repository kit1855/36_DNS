options {

    // network 
	listen-on port 53 { 192.168.50.10; };
	listen-on-v6 port 53 { ::1; };

    // data
	directory 	"/var/named";
	dump-file 	"/var/named/data/cache_dump.db";
	statistics-file "/var/named/data/named_stats.txt";
	memstatistics-file "/var/named/data/named_mem_stats.txt";

    // server
	recursion no;  // общая настройка, чтоб сервер не ходил куда либо, если у себя не находит зону
                   // аналогично сделал и на слэйве, но без комментария
	allow-query     { any; };

    // dnssec
	dnssec-validation yes;

    // others
	bindkeys-file "/etc/named.iscdlv.key";
	managed-keys-directory "/var/named/dynamic";
	pid-file "/run/named/named.pid";
	session-keyfile "/run/named/session.key";
};

logging {
        channel default_debug {
                file "data/named.run";
                severity dynamic;
        };
};

// ZONE TRANSFER WITH TSIG
include "/etc/named.zonetransfer.keys"; 
server 192.168.50.11 {
    keys { "zonetransfer.key"; };
};

view "client1" {
    // match-clients { 192.168.50.15; };
    match-clients { key "client1-transfer-key"; 192.168.50.15; };
    zone "." IN { type hint; file "named.ca"; };
    include "/etc/named.rfc1912.zones";
    include "/etc/named.root.key";

    // Урезанная зона (только web1)
    zone "dns.lab" {
        type master;
        file "/etc/named/named.dns.lab.client"; 
        allow-transfer { key "client1-transfer-key"; };
    };

    // Полная зона newdns.lab
    zone "newdns.lab" {
        type master;
        file "/etc/named/named.newdns.lab";
        allow-transfer { key "zonetransfer.key"; };
    };
};

view "client2" {
    match-clients { 192.168.50.16; };

    zone "." IN { type hint; file "named.ca"; };
    include "/etc/named.rfc1912.zones";
    include "/etc/named.root.key";

    // Полная зона dns.lab (web1 и web2)
    zone "dns.lab" {
        type master;
        file "/etc/named/named.dns.lab"; 
        allow-transfer { key "zonetransfer.key"; };
    };

    // ПУСТАЯ ЗОНА
    zone "newdns.lab" {
        type master;
        file "/etc/named/empty.newdns.lab";
        allow-transfer { none; };
    };
};

view "default" {
    match-clients { any; };

    zone "." IN { type hint; file "named.ca"; };
    include "/etc/named.rfc1912.zones";
    include "/etc/named.root.key";

    // Полная зона dns.lab
    zone "dns.lab" {
        type master;
        file "/etc/named/named.dns.lab";
        allow-transfer { key "zonetransfer.key"; };
    };

    // Полная зона newdns.lab
    zone "newdns.lab" {
        type master;
        file "/etc/named/named.newdns.lab";
        allow-transfer { key "zonetransfer.key"; };
    };
};
